<section class="home" aria-labelledby="home-title">
  <h1 id="home-title">Angular reusable buttons</h1>
  <div class="home__buttons" role="group"
    aria-label="Grupo de botões reutilizáveis no Angular moderno"
    data-test="button-group">
    <app-button label="Salvar" iconName="save" ariaLabel="Salvar dados" iconPos="right" width="auto" (buttonClick)="btnClickedHome($event)"></app-button>
    <app-button label="Exportar" ariaLabel="Exportar arquivo" variant="secondary" width="full" (buttonClick)="btnClickedHome($event)"></app-button>
    <app-button label="Cancelar" ariaLabel="Cancelar envio" [disabled]="true" (buttonClick)="btnClickedHome($event)"></app-button>
    <app-button label="Excluir" ariaLabel="Excluir dados" (buttonClick)="btnClickedHome($event)"></app-button>
    <app-button label="Carregar" iconName="upload" ariaLabel="Carregar foto" variant="outlined" (buttonClick)="btnClickedHome($event)"></app-button>
    <app-button label="Salvar" ariaLabel="Salvar formulário" [disabled]="true" (buttonClick)="btnClickedHome($event)"></app-button>
    <app-button label="Salvar" iconName="save" ariaLabel="Salvar dados" width="auto" (buttonClick)="btnClickedHome($event)"></app-button>
    <app-button label="Baixar" ariaLabel="Baixar documento" width="full" (buttonClick)="btnClickedHome($event)"></app-button>
  </div>
</section>
